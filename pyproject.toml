[project]
name = "navsim"
version = "0.1.0"
description = "Simulation de capteurs et estimation d'état pour drone à voilure fixe"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
replay = ["pyulog>=1.0", "pygeomag>=1.1"]
dev = ["pytest>=7", "hypothesis>=6", "pytest-cov>=4", "ruff>=0.5", "pyulog>=1.0", "pygeomag>=1.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Rules that point at likely bugs (undefined or unused names, mutable
# defaults, unreachable code...), not at style.
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = ["E402", "E731"]
