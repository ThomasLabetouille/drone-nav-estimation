name: tests

on:
  push:
  pull_request:

# ubuntu-24.04 rather than ubuntu-latest: a new image changes the compiler
# (and its warnings, errors with -Werror) without any change in the code.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src scripts tests

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: pip install -e ".[dev]"
      # the C++ and ULog tests skip themselves when their tools are missing;
      # here they must run, so check the tools first
      - run: python -c "import pyulog, pygeomag; from navsim import cpp_bridge; assert cpp_bridge.available()"
      - run: python -m pytest -q -rs --cov=navsim --cov-report=term-missing
      - run: python scripts/check_provenance.py
